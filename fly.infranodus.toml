# Fly config for the InfraNodus brand.
# Deploy with: fly deploy -c fly.infranodus.toml
#
# Same image/Dockerfile as the KeywordGraph app — only BRAND (and the per-app
# secrets set via `fly secrets set ... -a infranodus-mcp-server`) differ.

app = 'infranodus-mcp-server'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

  # Baked into the image so the server resolves this brand even if the runtime
  # `[env] BRAND` below is ever lost or overridden. Keep both in sync.
  [build.args]
    BRAND = 'infranodus'

[env]
  BRAND = 'infranodus'
  MCP_SOURCE = 'infranodus'
  CORS_ORIGIN = '*'
  INFRANODUS_API_BASE = 'https://infranodus.com/api/v1'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
