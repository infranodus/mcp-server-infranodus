# fly.toml app configuration file generated for keywordgraph-mcp-server on 2025-12-30T19:19:39+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'keywordgraph-mcp-server'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  CORS_ORIGIN = '*'
  KEYWORDGRAPH_API_BASE = 'https://keywordgraph.com/api/v1'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
