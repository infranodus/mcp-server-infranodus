# Fly config for the ExaltGrowth instance (KeywordGraph brand).
# A separate, isolated app — its own machines, secrets, and domain —
# running the same KeywordGraph brand as keywordgraph-mcp-server.
# Deploy with: fly deploy -c fly.exaltgrowth.toml   (or: npm run deploy:exalt)

app = 'exaltgrowth-mcp-server'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  BRAND = 'keywordgraph'
  MCP_SOURCE = 'exaltgrowth'
  CORS_ORIGIN = '*'
  KEYWORDGRAPH_API_BASE = 'https://keywordgraph.com/api/v1'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
