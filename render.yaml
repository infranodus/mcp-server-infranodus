# Render.com Blueprint
# Deploy by connecting your GitHub repo to Render

services:
  - type: web
    name: keywordgraph-mcp-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt  # or oregon, singapore, ohio
    plan: starter  # or standard, pro
    healthCheckPath: /health
    envVars:
      - key: BRAND
        value: keywordgraph
      - key: NODE_ENV
        value: production
      - key: KEYWORDGRAPH_API_BASE
        value: https://keywordgraph.com/api/v1
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true  # Render generates a random value
